services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  api:
    build: .
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/mock_test_platform
      JWT_ACCESS_SECRET: change-me
      JWT_REFRESH_SECRET: change-me-too
      CORS_ORIGIN: http://localhost:3000
    depends_on:
      - mongo

volumes:
  mongo_data:
